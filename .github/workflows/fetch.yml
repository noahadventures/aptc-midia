name: fetch
on:
  push:
    paths: ['fetch/list.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fetched
          while read -r name url; do [ -n "$name" ] && curl -sSfL -o "fetched/$name" "$url"; done < fetch/list.txt
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add fetched && git commit -m "fetched assets" && git push || echo nothing
